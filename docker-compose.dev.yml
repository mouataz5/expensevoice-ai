# Dev local — build « image figée » (Dockerfile prod) + frontend :3000, DB sur 5434.
#
# ⚠️ NE PAS lancer en parallèle avec docker-compose.yml (racine) :
#    les deux veulent le port 8000 pour le backend → un seul peut démarrer.
#    Préférez UNE stack :
#      • Hot-reload quotidien → docker compose up   (abes_dev_*, DB 5432, Vite 5173)
#      • OU ce fichier seul → docker compose -f docker-compose.dev.yml up -d --build
#
# Usage: docker compose -f docker-compose.dev.yml up -d --build
# Frontend: http://localhost:3000  |  API: http://localhost:8000  |  DB hôte: localhost:5434
# Arrêt: docker compose -f docker-compose.dev.yml down

name: expensevoice-ai-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expensevoice
    ports:
      - "5434:5432"   # 5434 sur l'hôte pour éviter conflit avec PostgreSQL local ou autre conteneur
    volumes:
      - expensevoice_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expensevoice"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: expensevoice-backend:dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/expensevoice
      JWT_SECRET: dev-secret-change-in-prod
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_PROVIDER: groq
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: expensevoice-frontend:dev
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  expensevoice_pg_dev:
