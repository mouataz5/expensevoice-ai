# Development docker-compose — run everything with: docker compose up
# Hot-reload backend (Dockerfile.dev) + dashboard Vite :5173 + Postgres :5432 (+ Redis).
#
# Après un recreate, n’enchaînez pas tout de suite curl sur :8000 : sous Docker Desktop (Windows),
# vous pouvez voir « curl: (52) Empty reply » pendant que l’image charge l’app (imports lourds).
# Utilisez plutôt :
#   docker compose up -d --force-recreate --wait backend
# ou attendez (healthy) dans `docker compose ps`, puis curl /health.
#
# ⚠️ Ne lancez pas en même temps docker-compose.dev.yml : le backend utilise aussi le port 8000.

services:
  db:
    image: postgres:16-alpine
    container_name: abes_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expensevoice
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: abes_dev_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: abes_dev_backend
    # Sans --reload : sous Docker Desktop (Windows), uvicorn --reload peut accepter la connexion
    # puis fermer sans corps HTTP (« curl: (52) Empty reply from server »). Pour le reload en dev,
    # lancer uvicorn localement ou commenter la ligne `command` ci‑dessous.
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/expensevoice
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Décommenter pour file d’attente Celery au lieu de BackgroundTasks uniquement :
      # - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    # Évite « curl: (52) Empty reply » si l’on interroge :8000 juste après le démarrage du
    # conteneur : Docker peut être « Up » avant qu’Uvicorn n’ait fini le chargement de l’app.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 60s

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: abes_dev_celery
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/expensevoice
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: celery -A app.workers.celery_app worker -l INFO -Q invoice,voice
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: abes_dev_dashboard
    volumes:
      - ./dashboard:/app
      - dashboard_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dev_pg_data:
  backend_venv:
  dashboard_modules:
