# Development docker-compose — run everything with: docker-compose up
# Hot-reload enabled for both backend and frontend via volume mounts.

services:
  db:
    image: postgres:16-alpine
    container_name: abes_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expensevoice
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: abes_dev_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: abes_dev_backend
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/expensevoice
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Décommenter pour file d’attente Celery au lieu de BackgroundTasks uniquement :
      # - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: abes_dev_celery
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/expensevoice
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: celery -A app.workers.celery_app worker -l INFO -Q invoice,voice
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: abes_dev_dashboard
    volumes:
      - ./dashboard:/app
      - dashboard_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  dev_pg_data:
  backend_venv:
  dashboard_modules:
